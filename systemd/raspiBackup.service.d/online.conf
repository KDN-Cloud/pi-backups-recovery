[Unit]
Wants=network-online.target mnt-unas_backups.mount
After=network-online.target docker.service mnt-unas_backups.mount

[Service]
Type=oneshot
ExecStart=
ExecStart=/usr/local/sbin/raspibackup-online
ExecStopPost=-/usr/local/sbin/raspibackup-telegram
ExecStopPost=/bin/sh -c 'if [ "$$SERVICE_RESULT" != success ]; then case "$$EXIT_STATUS" in ""|*[!0-9]*|0) status=1;; *) status="$$EXIT_STATUS";; esac; /usr/local/sbin/raspibackup-failure-mail "$$status"; fi'
TimeoutStartSec=3h
TimeoutStopSec=45s
Nice=12
IOSchedulingClass=best-effort
IOSchedulingPriority=7
CPUWeight=25
IOWeight=25
UMask=0077
